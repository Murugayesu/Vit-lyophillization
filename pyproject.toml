[project]
name = "vit-xai-lypholise"
version = "0.1.0"
description = "ViT-XAI-Lyo: Attention-Explainable ViT for Lyophilized Cake Defect Classification"
readme = "README.md"
authors = [
    { name = "Murugayesu", email = "sit24am039@sairamtap.edu.in" }
]
requires-python = ">=3.11, <3.14"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "timm>=1.0.0",
    "grad-cam>=1.5.0",
    "albumentations>=1.4.0",
    "opencv-python>=4.9.0.80",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "Pillow>=10.2.0",
    "numpy>=1.26.0",
    "gradio>=4.20.0",
    "tqdm>=4.66.0",
    "gdown>=5.1.0",
]

# Route torch and torchvision to the PyTorch CUDA 12.1 index explicitly
[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
